version: 2

updates:
  - package-ecosystem: "pip"
    directory: "/"
    # Security updates are applied instantly, but minor version patches will be auto-applied weekly.
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "07:00"
      timezone: "Europe/London"
    labels:
      - "dependencies"
      - "patch"
      - "python"
    # Major version updates (when there are no security issues) are ignored.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    # Updates are split into three:
    # - security-major: major changes solving security issues, raised instantly and mergeable with one tick;
    # - security-patch-minor: minor/patch changes solving security issues, applied instantly;
    # - version-patch-minor: all other non-major changes, applied weekly.
    groups:
      security-major:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "major"
      security-patch-minor:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      version-patch-minor:
        applies-to: version-updates
        patterns:
          - "*"

  # Same as above, but for Github Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "07:00"
      timezone: "Europe/London"
    labels:
      - "dependencies"
      - "patch"
      - "github-actions"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      security-major:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "major"
      security-patch-minor:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      version-patch-minor:
        applies-to: version-updates
        patterns:
          - "*"
